[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gta6-auto-clipper"
version = "0.1.0"
description = "Zero-cost, zero-local-storage autonomous GTA 6 short-form clipping & multi-platform publishing pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "yt-dlp>=2026.3.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
]

[project.scripts]
gta6-clipper = "gta6_clipper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
