name: Weekly Phase 0 Audit & Trend Check

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: gta6-clipper audit
